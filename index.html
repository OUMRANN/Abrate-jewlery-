<style>
:root{--ob:#0B0B0B;--ch:#151515;--gold:#D6B574;--iv:#F7F4EE;--gray:#A7A29A;--w:#fff;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--pad:clamp(20px,5vw,72px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.7 var(--sans);background:var(--ob);color:var(--iv);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.08}
h1{font-size:clamp(2.8rem,8vw,6rem)}h2{font-size:clamp(2rem,4.6vw,3.4rem)}h3{font-size:1.5rem}
.label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sec{padding:clamp(64px,10vw,130px) var(--pad)}
.ivory{background:var(--iv);color:var(--ob)}.ivory .label{color:#8a6d2f}
.charcoal{background:var(--ch)}
.wrap{max-width:1280px;margin:0 auto}
.lead{max-width:46ch;color:var(--gray);margin-top:16px}.ivory .lead{color:#5d5950}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border:1px solid var(--gold);background:var(--gold);color:var(--ob);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:background .3s,color .3s}
.btn:hover{background:transparent;color:var(--gold)}
.btn.ghost{background:transparent;color:var(--gold)}.btn.ghost:hover{background:var(--gold);color:var(--ob)}
.ivory .btn.ghost{color:var(--ob);border-color:var(--ob)}.ivory .btn.ghost:hover{background:var(--ob);color:var(--iv)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
/* announcement + nav */
.ann{background:var(--gold);color:var(--ob);text-align:center;font-size:.68rem;letter-spacing:.28em;padding:8px 12px;font-weight:600}
header{position:sticky;top:0;z-index:50;background:rgba(11,11,11,.94);border-bottom:1px solid #2a2a2a}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 var(--pad)}
.logo{font-family:var(--serif);font-size:1.7rem;letter-spacing:.14em;font-weight:600}.logo small{display:block;font:600 .55rem var(--sans);letter-spacing:.4em;color:var(--gold);margin-top:-4px}
.links{display:flex;gap:26px;align-items:center}
.links a{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);transition:color .25s}
.links a:hover,.links a.on{color:var(--gold)}
.burger{display:none;background:none;border:0;width:48px;height:48px;cursor:pointer}
.burger i{display:block;width:24px;height:1.5px;background:var(--iv);margin:6px auto;transition:transform .3s,opacity .3s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
@media(max-width:1080px){
.burger{display:block}
.links{position:fixed;top:0;left:0;right:0;bottom:0;margin-top:105px;flex-direction:column;align-items:flex-start;gap:0;background:var(--ob);padding:16px var(--pad);transform:translateY(-12px);opacity:0;visibility:hidden;transition:.35s}
.links.open{transform:none;opacity:1;visibility:visible}
.links a{font-family:var(--serif);font-size:1.8rem;text-transform:none;letter-spacing:0;padding:12px 0;width:100%;border-bottom:1px solid #222;color:var(--iv)}}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;min-height:calc(100vh - 105px);min-height:calc(100svh - 105px)}
.hero-t{padding:clamp(40px,7vw,100px) var(--pad);display:flex;flex-direction:column;justify-content:center}
.hero h1{margin:20px 0 24px}.hero h1 em{color:var(--gold)}
.hero-i{position:relative;overflow:hidden;background:var(--ch);animation:reveal 1.4s .2s cubic-bezier(.2,.7,.2,1) both}
.hero-i .ph{height:100%;min-height:360px}
.tag{position:absolute;left:20px;bottom:20px;font-size:.66rem;letter-spacing:.3em;color:var(--gold);writing-mode:horizontal-tb}
.hero-t>*{animation:up .9s both}.hero-t>*:nth-child(2){animation-delay:.12s}.hero-t>*:nth-child(3){animation-delay:.24s}.hero-t>*:nth-child(4){animation-delay:.36s}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}}
@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0}.hero-i{order:-1;height:42vh}}
/* placeholder art */
.ph{width:100%;height:100%;background:radial-gradient(ellipse at 30% 25%,#2a241a,#121212 70%);display:flex;align-items:center;justify-content:center;position:relative;color:var(--gold)}
.ph svg{width:46%;max-width:150px;opacity:.85}
.ph span{position:absolute;bottom:10px;left:12px;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
img.pi{width:100%;height:100%;object-fit:cover}
/* categories: mixed layout */
.cats{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(150px,20vw,260px);gap:14px;margin-top:48px}
.cat{position:relative;overflow:hidden;grid-column:span 2;background:var(--ch)}
.cat:nth-child(1){grid-column:span 3;grid-row:span 2}.cat:nth-child(2){grid-column:span 3}.cat:nth-child(3){grid-column:span 3}
.cat .ph,.cat img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.cat:hover .ph,.cat:hover img{transform:scale(1.06)}
.cat h3{position:absolute;left:20px;bottom:16px;z-index:2;text-shadow:0 2px 12px #000}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65));pointer-events:none}
.cat:hover h3{color:var(--gold)}
@media(max-width:700px){.cats{grid-template-columns:1fr 1fr}.cat,.cat:nth-child(n){grid-column:span 1;grid-row:span 1}.cat:nth-child(1){grid-column:span 2}}
/* products */
.tools{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0}
.tools input,.tools select{background:transparent;border:1px solid #444;padding:0 16px;min-height:48px;min-width:200px;flex:1}
.tools select option{color:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip{border:1px solid #444;background:none;padding:8px 16px;font-size:.72rem;letter-spacing:.1em;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--gold);color:var(--ob);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}
.card .im{aspect-ratio:4/5;overflow:hidden;background:var(--ch)}
.card .im>*{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .im>*{transform:scale(1.05)}
.card h3{font-size:1.35rem;margin-top:14px}
.card p{font-size:.78rem;color:var(--gray)}
.card .pr{color:var(--gold);font-size:.85rem;margin-top:2px}
.card .acts{display:flex;gap:8px;margin-top:10px}
.card .acts .btn{min-height:42px;padding:0 16px;font-size:.66rem}
.demo{display:inline-block;font-size:.6rem;letter-spacing:.14em;border:1px solid #555;color:var(--gray);padding:1px 8px;margin-top:6px;text-transform:uppercase}
.ivory .card p{color:#5d5950}.ivory .demo{border-color:#bbb;color:#777}
.empty{padding:60px 0;text-align:center;color:var(--gray)}
.notice{border:1px dashed #6b5a35;color:var(--gold);padding:12px 16px;font-size:.8rem;margin-bottom:24px}
/* editorial */
.edit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,90px);align-items:center}
.edit .im{aspect-ratio:4/5;background:var(--ch);margin-bottom:-60px}
.edit .im+div{padding-top:20px}
@media(max-width:820px){.edit{grid-template-columns:1fr}.edit .im{margin:0}}
/* whatsapp */
.wa{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
/* reviews */
.rev{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px}
@media(max-width:1100px){.rev{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.rev{grid-template-columns:1fr}}
.rc{border:1px solid #2e2e2e;background:var(--ch);padding:26px 22px;transition:transform .4s,border-color .4s,box-shadow .4s}
.rc:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.rc q{display:block;font-family:var(--serif);font-size:1.18rem;line-height:1.5;quotes:none;margin:10px 0 18px}
.rc q::before{content:"\201C";display:block;font-size:3rem;line-height:.6;color:var(--gold)}
.stars{color:var(--gold);letter-spacing:3px;font-size:.95rem}
.js .stars span{display:inline-block;opacity:0;transform:scale(.6);transition:.5s}
.js .in .stars span{opacity:1;transform:none}
.rc b{display:block;font-weight:600;font-size:.88rem}.rc small{color:var(--gray);font-size:.74rem}
/* reveal */
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
/* branches */
.br{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:44px;border:1px solid #cfc8b8}
.br>div{padding:clamp(28px,5vw,60px)}.br>div+div{border-left:1px solid #cfc8b8}
.br h3{font-size:2.2rem}.br p{margin:10px 0;color:#5d5950}
@media(max-width:720px){.br{grid-template-columns:1fr}.br>div+div{border-left:0;border-top:1px solid #cfc8b8}}
/* product page */
.pd{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,80px);margin-top:24px}
.pd .im{aspect-ratio:4/5;background:var(--ch)}
.pd h1{font-size:clamp(2.2rem,5vw,3.6rem);margin:12px 0}
@media(max-width:820px){.pd{grid-template-columns:1fr}}
.back{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
/* form */
form{display:grid;gap:14px;max-width:560px;margin-top:24px}
form input,form select,form textarea{background:transparent;border:1px solid #444;padding:12px 14px;min-height:48px;width:100%}
form textarea{min-height:120px}form option{color:#000}
.err{color:#e8a4a4;font-size:.8rem;min-height:1em}
/* tiktok / final / footer */
.center{text-align:center}.center .lead{margin-left:auto;margin-right:auto}.center .row{justify-content:center}
.fin{padding:clamp(80px,14vw,180px) var(--pad);background:radial-gradient(ellipse at 50% 120%,#2a241a,var(--ob) 65%)}
footer{background:var(--ch);padding:64px var(--pad) 28px;border-top:1px solid #2a2a2a}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px}
@media(max-width:860px){.fg{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fg{grid-template-columns:1fr}}
footer h4{font-size:.7rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
footer li{list-style:none;margin:6px 0;font-size:.88rem;color:var(--gray)}footer a:hover{color:var(--gold)}
.copy{margin-top:44px;padding-top:20px;border-top:1px solid #2a2a2a;font-size:.74rem;color:var(--gray)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv,.js .stars span{opacity:1!important;transform:none!important}}
</style>
</head>

<script>
document.documentElement.classList.add('js');
/* ============ CENTRAL CONFIG — edit here ============ */
const PHONES=[{label:'0963 080 977',local:'0963080977',intl:'251963080977'},{label:'0911 399 999',local:'0911399999',intl:'251911399999'}];
const TIKTOK='https://www.tiktok.com/@abrate.jewlery2222?_r=1&_t=ZS-9AxgR2F3AEY';

const CATS=['Necklaces','Rings','Earrings','Bracelets','Watches','Handbags','Purses','Other Accessories'];
const GROUPS={jewelry:['Necklaces','Rings','Earrings','Bracelets'],bags:['Handbags','Purses']};

const CATEGORY_IMG={'Necklaces':'','Rings':'','Earrings':'','Bracelets':'','Watches':'','Handbags':'','Purses':'','Other Accessories':'','hero':'','editorial':''};

].map((c,i)=>({id:'p'+(i+1),name:'Sample '+c.replace(/s$/,'').replace('Other Accessories','Accessory')+' '+(i%2+1),category:c,description:'',price:null,image:'',availability:'',featured:i<8,displayOrder:i+1,placeholder:true}));

['Hana M.','I love the selection of jewelry and accessories. The pieces are beautiful, and I found something that perfectly matches my style.'],

].map(r=>({name:r[0],location:'Addis Ababa, Ethiopia',rating:5,text:r[1],demo:true}));
const SHOW_DEMO_BADGES=true;
/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MSG={
general:()=>'Hello Abrate Jewelry, I visited your website and would like to know more about your products.',
product:n=>`Hello Abrate Jewelry, I am interested in ${n}. Could you please confirm the price and availability?`,
price:n=>`Hello Abrate Jewelry, could you please tell me the price of ${n}?`,

const ICONS={Necklaces:'<path d="M12 20c0-30 76-30 76 0M50 56l10 14-10 14-10-14z"/>',Rings:'<circle cx="50" cy="62" r="24"/><path d="M40 38l10-14 10 14z"/>',Earrings:'<path d="M50 14v14"/><circle cx="50" cy="42" r="6"/><path d="M50 48l-14 34h28z"/>',Bracelets:'<ellipse cx="50" cy="50" rx="38" ry="22"/><ellipse cx="50" cy="50" rx="30" ry="14"/>',Watches:'<rect x="32" y="30" width="36" height="40" rx="10"/><path d="M38 30l4-18h16l4 18M38 70l4 18h16l4-18M50 42v10l8 4"/>',Handbags:'<rect x="18" y="38" width="64" height="44"/><path d="M34 38c0-28 32-28 32 0"/>',Purses:'<rect x="20" y="40" width="60" height="38" rx="8"/><path d="M20 52h60M50 52v8"/>','Other Accessories':'<path d="M50 14l10 22 24 4-17 17 4 24-21-12-21 12 4-24-17-17 24-4z"/>',hero:'<path d="M50 14l10 22 24 4-17 17 4 24-21-12-21 12 4-24-17-17 24-4z"/>'};
function art(cat,key,ratio){const src=key||'';const ic=ICONS[cat]||ICONS.hero;
 if(src)return `<img class="pi" src="${esc(src)}" alt="${esc(cat)} — Abrate Jewelry" loading="lazy">`;
 return `<div class="ph" role="img" aria-label="Placeholder image for ${esc(cat)}"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2">${ic}</svg><span>Photo placeholder</span></div>`}

function card(p){return `<article class="card rv"><a href="#/product/${p.id}" class="im" aria-label="View ${esc(p.name)}">${art(p.category,p.image)}</a>

/* ============ VIEWS ============ */
const catCard=c=>`<a class="cat rv" href="#/shop/${encodeURIComponent(c)}"><div style="height:100%">${art(c,CATEGORY_IMG[c])}</div><h3>${c}</h3></a>`;

<p class="lead">Discover the experiences and styles that make every detail special.</p>
${SHOW_DEMO_BADGES?'<div class="notice" style="margin-top:20px">Demo content: these eight reviews are drafts, not verified customer statements. Replace them with real approved reviews before launch.</div>':''}</div>
<div class="rev">${REVIEWS.map((r,i)=>`<figure class="rc rv" style="--d:${(i%4)*.1}s"><div class="stars" aria-label="${r.rating} out of 5 stars">${[...Array(r.rating)].map((_,k)=>`<span style="transition-delay:${.3+k*.08}s">★</span>`).join('')}</div>
<blockquote><q>${esc(r.text)}</q></blockquote><figcaption><b>${esc(r.name)}</b><small>${esc(r.location)}</small>${r.demo&&SHOW_DEMO_BADGES?'<br><span class="demo">Demo review</span>':''}</figcaption></figure>`).join('')}</div>
<div class="center rv" style="margin-top:64px"><span class="label">Your next favorite piece awaits</span><div class="row"><a class="btn" href="#/shop">Explore the Collection</a></div></div></div></section>
<section class="sec ivory" id="visit"><div class="wrap"><span class="label">Visit Abrate</span><h2 style="margin-top:12px">Two branches in Addis Ababa.</h2>
<div class="br rv">${['Bethel','Merkato'].map(b=>`<div><h3>${b}</h3><p>Visit our ${b} branch in Addis Ababa.</p><p style="font-size:.85rem">Message us for the exact address and directions.</p>
<div class="row"><a class="btn" target="_blank" rel="noopener" href="${waURL(0,'dir',b)}">Ask for directions</a><a class="btn ghost" href="tel:+${PHONES[0].intl}">Call ${PHONES[0].label}</a></div></div>`).join('')}</div></div></section>
<section class="sec charcoal center"><div class="wrap rv"><span class="label">TikTok</span><h2 style="margin:12px 0">Discover More of Abrate</h2>
<p class="lead">Explore our latest looks, accessories, and updates.</p><div class="row"><a class="btn" target="_blank" rel="noopener" href="${TIKTOK}">Follow Us on TikTok</a></div></div></section>
<section class="fin center"><div class="wrap rv"><h2 style="font-size:clamp(2.4rem,6.5vw,5rem)">Your Next Favorite<br>Piece Awaits.</h2>
<div class="row"><a class="btn" href="#/shop">Explore Collections</a><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'general')}">Contact Us on WhatsApp</a></div></div></section>`;

const shop=(arg)=>{ // arg: category, group key or ''
 let sel=new Set(GROUPS[arg]||(CATS.includes(arg)?[arg]:CATS)),all=!arg;
 return `<section class="sec"><div class="wrap"><span class="label">Shop</span><h1 style="font-size:clamp(2.4rem,6vw,4.5rem);margin:12px 0">The Collection</h1>
<div class="notice">Sample products shown for layout only. Add real items and photos in the PRODUCTS list.</div>
<div class="tools"><input id="q" type="search" placeholder="Search products" aria-label="Search products"><select id="sort" aria-label="Sort"><option value="o">Featured order</option><option value="a">Name A–Z</option><option value="z">Name Z–A</option></select></div>
<div class="chips" id="chips"><button class="chip" aria-pressed="${all}" data-c="">All</button>${CATS.map(c=>`<button class="chip" aria-pressed="${!all&&sel.has(c)}" data-c="${c}">${c}</button>`).join('')}</div>
<div class="grid" id="list" aria-live="polite"></div></div></section>`};
function shopInit(arg){
 let active=new Set(GROUPS[arg]||(CATS.includes(arg)?[arg]:[]));
 const draw=()=>{const q=$('#q').value.trim().toLowerCase(),s=$('#sort').value;
  let l=PRODUCTS.filter(p=>(!active.size||active.has(p.category))&&(p.name+p.category+p.description).toLowerCase().includes(q));
  l.sort((a,b)=>s==='a'?a.name.localeCompare(b.name):s==='z'?b.name.localeCompare(a.name):a.displayOrder-b.displayOrder);
  $('#list').innerHTML=l.length?l.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><p>No products match your search.</p><div class="row" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="${waURL(0,'general')}">Ask us on WhatsApp</a></div></div>`;
  $$('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c?active.has(b.dataset.c):!active.size));reveal()};
 $('#q').oninput=draw;$('#sort').onchange=draw;
 $$('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(!c)active.clear();else active.has(c)?active.delete(c):active.add(c);draw()});draw()}

const product=id=>{const p=PRODUCTS.find(x=>x.id===id);if(!p)return `<section class="sec"><div class="wrap empty"><h2>Product not found</h2><div class="row" style="justify-content:center"><a class="btn" href="#/shop">Back to collection</a></div></div></section>`;
 const rel=PRODUCTS.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4);
 return `<section class="sec"><div class="wrap"><a class="back" href="#/shop">← Back to collection</a>
<div class="pd"><div class="im">${art(p.category,p.image)}</div><div><span class="label">${esc(p.category)}</span><h1>${esc(p.name)}</h1>${price(p)}
${p.description?`<p class="lead">${esc(p.description)}</p>`:''}${p.availability?`<p style="margin-top:12px">Availability: ${esc(p.availability)}</p>`:'<p class="lead">Contact us to confirm availability.</p>'}
${p.placeholder?'<span class="demo">Sample · not confirmed stock</span>':''}
<div class="wa">${waBtns('product',p.name,'btn','Ask on WhatsApp')}</div>
<div class="wa"><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'price',p.name)}">Ask price</a><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'avail',p.name)}">Ask availability</a></div></div></div>
${rel.length?`<h2 style="margin:80px 0 24px;font-size:2rem">You may also like</h2><div class="grid">${rel.map(card).join('')}</div>`:''}</div></section>`};

const contact=()=>`<section class="sec"><div class="wrap"><span class="label">Contact</span><h1 style="font-size:clamp(2.4rem,6vw,4.5rem);margin:12px 0">Abrate Jewelry</h1><p class="lead">Shine Bright. Reach our team by phone or WhatsApp.</p>
<div class="wa">${waBtns('general')}</div><div class="wa">${PHONES.map(p=>`<a class="btn ghost" href="tel:+${p.intl}">Call ${p.label}</a>`).join('')}<a class="btn ghost" target="_blank" rel="noopener" href="${TIKTOK}">TikTok</a>${TELEGRAM?`<a class="btn ghost" target="_blank" rel="noopener" href="${TELEGRAM}">Telegram</a>`:''}</div>
<div class="br" style="border-color:#333;margin:48px 0">${['Bethel','Merkato'].map(b=>`<div style="border-color:#333"><h3>${b}</h3><p style="color:var(--gray)">Our ${b} branch, Addis Ababa. Ask us for the exact address.</p><div class="row"><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'dir',b)}">Request directions</a></div></div>`).join('')}</div>
<h2 style="font-size:2rem">Send an inquiry</h2><p class="lead">This opens WhatsApp with your message ready to send.</p>
<form id="cf" novalidate><div><input name="n" placeholder="Your name" aria-label="Your name"><div class="err" data-e="n"></div></div>
<div><input name="t" type="tel" placeholder="Your phone number" aria-label="Your phone number"><div class="err" data-e="t"></div></div>
<select name="k" aria-label="Inquiry type"><option>Product inquiry</option><option>Price question</option><option>Availability</option><option>Branch directions</option><option>Other</option></select>
<div><textarea name="m" placeholder="Your message" aria-label="Your message"></textarea><div class="err" data-e="m"></div></div>
<select name="to" aria-label="Which number">${PHONES.map((p,i)=>`<option value="${i}">Send to ${p.label}</option>`).join('')}</select>
<button class="btn" type="submit">Continue on WhatsApp</button></form></div></section>`;
function contactInit(){$('#cf').onsubmit=e=>{e.preventDefault();const f=e.target,v=n=>f[n].value.trim();let ok=true;
 const chk=(n,bad,msg)=>{$(`[data-e=${n}]`).textContent=bad?msg:'';if(bad)ok=false};
 chk('n',v('n').length<2,'Please enter your name.');chk('t',!/^[+\d][\d\s-]{6,}$/.test(v('t')),'Please enter a valid phone number.');chk('m',v('m').length<5,'Please write a short message.');
 if(!ok)return;const text=`Hello Abrate Jewelry, my name is ${v('n')} (${v('t')}). ${v('k')}: ${v('m')}`;
 window.open(`https://wa.me/${PHONES[f.to.value].intl}?text=${encodeURIComponent(text)}`,'_blank','noopener')}}

const foot=()=>`<div class="fg"><div><div class="logo">ABRATE<small>JEWELRY</small></div><p style="margin:14px 0 6px;font-family:var(--serif);font-size:1.4rem;color:var(--gold)">Shine Bright.</p><p style="font-size:.85rem;color:var(--gray);max-width:32ch">Jewelry, watches, handbags, purses, and fashion accessories in Addis Ababa.</p></div>
<div><h4>Shop</h4><ul>${CATS.map(c=>`<li><a href="#/shop/${encodeURIComponent(c)}">${c}</a></li>`).join('')}<li><a href="#reviews">Customer Reviews</a></li></ul></div>
<div><h4>Branches</h4><ul><li>Bethel, Addis Ababa</li><li>Merkato, Addis Ababa</li><li><a target="_blank" rel="noopener" href="${TIKTOK}">TikTok</a></li>${TELEGRAM?`<li><a target="_blank" rel="noopener" href="${TELEGRAM}">Telegram</a></li>`:''}</ul></div>
<div><h4>Contact</h4><ul>${PHONES.map((p,i)=>`<li><a href="tel:+${p.intl}">${p.label}</a> · <a target="_blank" rel="noopener" href="${waURL(i,'general')}">WhatsApp</a></li>`).join('')}</ul></div></div>
<div class="copy">© ${new Date().getFullYear()} Abrate Jewelry. All rights reserved.</div>`;

/* ============ ROUTER + MOTION ============ */
let io;
function reveal(){if(!('IntersectionObserver'in window)){$$('.rv').forEach(e=>e.classList.add('in'));return}
 io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -40px 0px'});
 $$('.rv:not(.in)').forEach(e=>io.observe(e))}
function route(){const h=location.hash||'#/';
 if(/^#(reviews|visit|whatsapp)$/.test(h)){const t=$(h);if(t){t.scrollIntoView();return}location.hash='#/';return}
 const [,pg,arg]=h.replace('#','').split('/'),a=decodeURIComponent(arg||'');
 const app=$('#app');let key='home';
 if(pg==='shop'){app.innerHTML=shop(a);shopInit(a);key='shop';document.title='Shop | Abrate Jewelry'}
 else if(pg==='product'){app.innerHTML=product(a);key='shop';document.title=((PRODUCTS.find(p=>p.id===a)||{}).name||'Product')+' | Abrate Jewelry'}
 else if(pg==='contact'){app.innerHTML=contact();contactInit();key='contact';document.title='Contact | Abrate Jewelry'}
 else{app.innerHTML=home();document.title='Abrate Jewelry | Shine Bright in Addis Ababa'}
 $$('.links a[data-p]').forEach(l=>l.classList.toggle('on',l.dataset.p===key));
 $$('[data-wa]').forEach(l=>l.href=waURL(0,'general'));
 closeMenu();window.scrollTo(0,0);reveal()}
const burger=$('.burger'),links=$('#links');
function closeMenu(){links.classList.remove('open');burger.setAttribute('aria-expanded','false')}
burger.onclick=()=>{const o=links.classList.toggle('open');burger.setAttribute('aria-expanded',o)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
$('#foot').innerHTML=foot();
addEventListener('hashchange',route);route();
</script>
</body>
</html>
