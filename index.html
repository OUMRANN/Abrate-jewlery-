'Other Accessories':`<path d="M28 82H90Q92 142 58 142Q26 142 28 82Z" fill="url(#lens)" stroke="url(#g)" stroke-width="4.5" stroke-linejoin="round"/><path d="M110 82H172Q174 142 142 142Q108 142 110 82Z" fill="url(#lens)" stroke="url(#g)" stroke-width="4.5" stroke-linejoin="round"/><path d="M90 88Q100 76 110 88" fill="none" stroke="url(#g)" stroke-width="4.5"/><path d="M28 86L12 78M172 86L188 78" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/><path d="M38 92L56 92M120 92L138 92" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>`};
const SPARK=`<path d="M22 30l2.2 6.8L31 39l-6.8 2.2L22 48l-2.2-6.8L13 39l6.8-2.2z" fill="#F6E4B0" opacity=".85"/><path d="M176 52l1.6 5 5 1.6-5 1.6-1.6 5-1.6-5-5-1.6 5-1.6z" fill="#F6E4B0" opacity=".7"/><ellipse cx="100" cy="190" rx="56" ry="4.5" fill="#000" opacity=".55"/>`;
function art(cat,src,alt){
 if(src)return `<img class="pi" src="${esc(src)}" alt="${esc(cat)} — Abrate Jewelry" loading="lazy">`;
 let a=ART[cat]||ART['Other Accessories'];if(alt)a=a.replaceAll('url(#g)','url(#s)');
 return `<div class="ph"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(cat)} illustration">${SPARK}${a}</svg></div>`}
const price=p=>`<div class="pr">${p.price?esc(p.price):'Contact for Price'}</div>`;
const card=p=>`<article class="card rv"><a href="#/product/${p.id}" class="im" aria-label="View ${esc(p.name)}">${art(p.category,p.image,p.alt)}</a>
<h3><a href="#/product/${p.id}">${esc(p.name)}</a></h3><p>${esc(p.category)}</p>${price(p)}${p.placeholder?'<span class="demo">Sample item</span>':''}
<div class="acts"><a class="btn ghost" href="#/product/${p.id}">Details</a><a class="btn" target="_blank" rel="noopener" href="${waURL(0,'product',p.name)}">Inquire</a></div></article>`;
/* ============ VIEWS ============ */
const catCard=c=>`<a class="cat" href="#/shop/${encodeURIComponent(c)}"><div>${art(c,CATEGORY_IMG[c])}</div><h3>${c}</h3></a>`;
const home=()=>`
<section class="hero"><div class="hero-t"><span class="label">The Art of Accessory</span>
<h1>Shine Bright.<br><em>Make It Yours.</em></h1>
<p class="lead">Discover jewelry, watches, handbags, and accessories selected to complement your personal style.</p>
<div class="row"><a class="btn" href="#/shop">Explore the Collection</a><a class="btn ghost" href="#/contact">Contact Our Store</a></div></div>
<div class="hero-i">${art('Necklaces',CATEGORY_IMG.hero)}<span class="tag">ABRATE JEWELRY / ADDIS ABABA</span></div></section>
<section class="sec ivory"><div class="wrap"><span class="label">Shop by category</span><h2 style="margin-top:12px">Find your piece.</h2>
<div class="cats">${CATS.map(catCard).join('')}</div></div></section>
<section class="sec"><div class="wrap"><span class="label">The Collection</span><h2 style="margin-top:12px">Pieces that complete your look.</h2>
<div class="notice" style="margin:24px 0">Sample items shown for layout. Add your real products and photos in the PRODUCTS list.</div>
<div class="grid">${PRODUCTS.filter(p=>p.featured).map(card).join('')}</div>
<div class="row"><a class="btn ghost" href="#/shop">View all</a></div></div></section>
<section class="sec charcoal"><div class="wrap edit"><div class="im">${art('Earrings',CATEGORY_IMG.editorial)}</div>
<div class="rv"><span class="label">Abrate Jewelry</span><h2 style="margin:12px 0">Every Detail Tells Your Story.</h2>
<p class="lead">From everyday essentials to statement accessories, explore pieces that help express your individual style.</p></div></div></section>
<section class="sec ivory" id="whatsapp"><div class="wrap rv"><span class="label">Shop with our team</span><h2 style="margin:12px 0">Found Something You Love?</h2>
<p class="lead">Contact our team to ask about availability, pricing, and product details.</p><div class="wa">${waBtns('general')}</div></div></section>
<section class="sec" id="reviews"><div class="wrap"><div class="rail-head rv"><div><span class="label">Loved in Addis Ababa</span><h2 style="margin:12px 0">Words From Our Customers.</h2>
<p class="lead">Discover the experiences and styles that make every detail special.</p></div>
<div class="arrows"><button class="arr" id="prev" aria-label="Previous reviews">←</button><button class="arr" id="next" aria-label="Next reviews">→</button></div></div>
${SHOW_DEMO_BADGES?'<div class="notice" style="margin-top:20px">Demo content: these eight reviews are drafts, not verified customer statements. Replace them with real approved reviews before launch.</div>':''}
<div class="rail rv" id="rail" tabindex="0" role="region" aria-label="Customer reviews, scroll sideways">${REVIEWS.map(r=>`<figure class="rc"><div class="stars" role="img" aria-label="${r.rating} out of 5 stars">${[...Array(r.rating)].map((_,k)=>`<span style="transition-delay:${.3+k*.1}s">★</span>`).join('')}</div>
<blockquote><q>${esc(r.text)}</q></blockquote><figcaption><b>${esc(r.name)}</b><small>${esc(r.location)}</small>${r.demo&&SHOW_DEMO_BADGES?'<br><span class="demo">Demo review</span>':''}</figcaption></figure>`).join('')}</div>
<div class="center rv" style="margin-top:40px"><span class="label">Your next favorite piece awaits</span><div class="row"><a class="btn" href="#/shop">Explore the Collection</a></div></div></div></section>
<section class="sec ivory" id="visit"><div class="wrap"><span class="label">Visit Abrate</span><h2 style="margin-top:12px">Two branches in Addis Ababa.</h2>
<div class="br">${['Bethel','Merkato'].map(b=>`<div><h3>${b}</h3><p>Visit our ${b} branch in Addis Ababa.</p><p style="font-size:.88rem">Message us for the exact address and directions.</p>
<div class="row"><a class="btn" target="_blank" rel="noopener" href="${waURL(0,'dir',b)}">Ask for directions</a><a class="btn ghost" href="tel:+${PHONES[0].intl}">Call ${PHONES[0].label}</a></div></div>`).join('')}</div></div></section>
<section class="sec charcoal center"><div class="wrap rv"><span class="label">TikTok</span><h2 style="margin:12px 0">Discover More of Abrate</h2>
<p class="lead">Explore our latest looks, accessories, and updates.</p><div class="row"><a class="btn" target="_blank" rel="noopener" href="${TIKTOK}">Follow Us on TikTok</a></div></div></section>
<section class="sec fin center" style="padding-block:clamp(80px,14vw,170px)"><div class="wrap rv"><h2 style="font-size:clamp(2.4rem,6.5vw,5rem)">Your Next Favorite<br>Piece Awaits.</h2>
<div class="row"><a class="btn" href="#/shop">Explore Collections</a><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'general')}">Contact Us on WhatsApp</a></div></div></section>`;
function homeInit(){const r=$('#rail'),p=$('#prev'),n=$('#next');if(!r)return;
 const step=()=>($('.rc',r).offsetWidth||300)+16,upd=()=>{p.disabled=r.scrollLeft<4;n.disabled=r.scrollLeft+r.clientWidth>=r.scrollWidth-4};
 p.onclick=()=>r.scrollBy({left:-step(),behavior:'smooth'});n.onclick=()=>r.scrollBy({left:step(),behavior:'smooth'});
 r.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});r.onkeydown=e=>{if(e.key==='ArrowRight')n.click();if(e.key==='ArrowLeft')p.click()};upd()}

const shop=()=>`<section class="sec"><div class="wrap"><span class="label">Shop</span><h1 style="font-size:clamp(2.4rem,6vw,4.5rem);margin:12px 0">The Collection</h1>
<div class="notice">Sample items shown for layout. Add real items and photos in the PRODUCTS list.</div>
<div class="tools"><input id="q" type="search" placeholder="Search products" aria-label="Search products"><select id="sort" aria-label="Sort"><option value="o">Featured order</option><option value="a">Name A–Z</option><option value="z">Name Z–A</option></select></div>
<div class="chips"><button class="chip" data-c="">All</button>${CATS.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')}</div>
<div class="grid" id="list" aria-live="polite"></div></div></section>`;
function shopInit(arg){
 const active=new Set(GROUPS[arg]||(CATS.includes(arg)?[arg]:[]));
 const draw=()=>{const q=$('#q').value.trim().toLowerCase(),s=$('#sort').value;
  const l=PRODUCTS.filter(p=>(!active.size||active.has(p.category))&&(p.name+' '+p.category+' '+p.description).toLowerCase().includes(q));
  l.sort((a,b)=>s==='a'?a.name.localeCompare(b.name):s==='z'?b.name.localeCompare(a.name):a.displayOrder-b.displayOrder);
  $('#list').innerHTML=l.length?l.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><p>No products match your search. Try another word or ask our team.</p><div class="row" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="${waURL(0,'general')}">Ask on WhatsApp</a></div></div>`;
  $$('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c?active.has(b.dataset.c):!active.size));reveal()};
 $('#q').oninput=draw;$('#sort').onchange=draw;
 $$('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(!c)active.clear();else active.has(c)?active.delete(c):active.add(c);draw()});draw()}
const product=id=>{const p=PRODUCTS.find(x=>x.id===id);if(!p)return `<section class="sec"><div class="wrap empty"><h2>Product not found</h2><div class="row" style="justify-content:center"><a class="btn" href="#/shop">Back to collection</a></div></div></section>`;
 const rel=PRODUCTS.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4);
 return `<section class="sec"><div class="wrap"><a class="back" href="#/shop">← Back to collection</a>
<div class="pd"><div class="im">${art(p.category,p.image,p.alt)}</div><div><span class="label">${esc(p.category)}</span><h1>${esc(p.name)}</h1>${price(p)}
${p.description?`<p class="lead">${esc(p.description)}</p>`:''}<p class="lead">${p.availability?'Availability: '+esc(p.availability):'Contact us to confirm availability.'}</p>
${p.placeholder?'<span class="demo">Sample item</span>':''}
<div class="wa">${waBtns('product',p.name,'btn','Ask on WhatsApp')}</div>
<div class="wa"><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'price',p.name)}">Ask price</a><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'avail',p.name)}">Ask availability</a></div></div></div>
${rel.length?`<h2 style="margin:80px 0 24px;font-size:2rem">You may also like</h2><div class="grid">${rel.map(card).join('')}</div>`:''}</div></section>`};
const contact=()=>`<section class="sec"><div class="wrap"><span class="label">Contact</span><h1 style="font-size:clamp(2.4rem,6vw,4.5rem);margin:12px 0">Abrate Jewelry</h1><p class="lead">Shine Bright. Reach our team by phone or WhatsApp.</p>
<div class="wa">${waBtns('general')}</div><div class="wa">${PHONES.map(p=>`<a class="btn ghost" href="tel:+${p.intl}">Call ${p.label}</a>`).join('')}<a class="btn ghost" target="_blank" rel="noopener" href="${TIKTOK}">TikTok</a>${TELEGRAM?`<a class="btn ghost" target="_blank" rel="noopener" href="${TELEGRAM}">Telegram</a>`:''}</div>
<div class="br" style="margin:48px 0">${['Bethel','Merkato'].map(b=>`<div><h3>${b}</h3><p>Our ${b} branch, Addis Ababa. Ask us for the exact address.</p><div class="row"><a class="btn ghost" target="_blank" rel="noopener" href="${waURL(0,'dir',b)}">Request directions</a></div></div>`).join('')}</div>
<h2 style="font-size:2rem">Send an inquiry</h2><p class="lead">This opens WhatsApp with your message ready to send.</p>
<form id="cf" novalidate><div><input name="n" placeholder="Your name" aria-label="Your name"><div class="err" data-e="n"></div></div>
<div><input name="t" type="tel" placeholder="Your phone number" aria-label="Your phone number"><div class="err" data-e="t"></div></div>
<select name="k" aria-label="Inquiry type"><option>Product inquiry</option><option>Price question</option><option>Availability</option><option>Branch directions</option><option>Other</option></select>
<div><textarea name="m" placeholder="Your message" aria-label="Your message"></textarea><div class="err" data-e="m"></div></div>
<select name="to" aria-label="Which number">${PHONES.map((p,i)=>`<option value="${i}">Send to ${p.label}</option>`).join('')}</select>
<button class="btn" type="submit">Continue on WhatsApp</button></form></div></section>`;
function contactInit(){$('#cf').onsubmit=e=>{e.preventDefault();const f=e.target,v=n=>f[n].value.trim();let ok=true;
 const chk=(n,bad,msg)=>{$(`[data-e=${n}]`).textContent=bad?msg:'';if(bad)ok=false};
 chk('n',v('n').length<2,'Please enter your name.');chk('t',!/^[+\d][\d\s-]{6,}$/.test(v('t')),'Please enter a valid phone number.');chk('m',v('m').length<5,'Please write a short message.');
 if(!ok)return;window.open(`https://wa.me/${PHONES[f.to.value].intl}?text=${encodeURIComponent(`Hello Abrate Jewelry, my name is ${v('n')} (${v('t')}). ${v('k')}: ${v('m')}`)}`,'_blank','noopener')}}
const foot=()=>`<div class="fg"><div><div class="logo">ABRATE<small>JEWELRY</small></div><p style="margin:14px 0 6px;font-family:var(--serif);font-size:1.5rem;color:var(--gold)">Shine Bright.</p><p style="font-size:.88rem;color:var(--gray);max-width:32ch">Jewelry, watches, handbags, purses, and fashion accessories in Addis Ababa.</p></div>
<div><h4>Shop</h4><ul>${CATS.map(c=>`<li><a href="#/shop/${encodeURIComponent(c)}">${c}</a></li>`).join('')}<li><a href="#reviews">Customer Reviews</a></li></ul></div>
<div><h4>Branches</h4><ul><li>Bethel, Addis Ababa</li><li>Merkato, Addis Ababa</li><li><a target="_blank" rel="noopener" href="${TIKTOK}">TikTok</a></li>${TELEGRAM?`<li><a target="_blank" rel="noopener" href="${TELEGRAM}">Telegram</a></li>`:''}</ul></div>
<div><h4>Contact</h4><ul>${PHONES.map((p,i)=>`<li><a href="tel:+${p.intl}">${p.label}</a> · <a target="_blank" rel="noopener" href="${waURL(i,'general')}">WhatsApp</a></li>`).join('')}</ul></div></div>
<div class="copy">© ${new Date().getFullYear()} Abrate Jewelry. All rights reserved.</div>`;
/* ============ ROUTER + MOTION ============ */
let io;
function reveal(){if(!('IntersectionObserver'in window)){$$('.rv').forEach(e=>e.classList.add('in'));return}
 io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
 $$('.rv:not(.in)').forEach(e=>io.observe(e));
 setTimeout(()=>$$('.rv:not(.in)').forEach(e=>{const r=e.getBoundingClientRect();if(r.top<innerHeight)e.classList.add('in')}),1200)}
let cur='';
function render(pg,a){const k=pg+'/'+a;if(k===cur)return;cur=k;const app=$('#app');let key='home';
 if(pg==='shop'){app.innerHTML=shop();shopInit(a);key='shop';document.title='Shop | Abrate Jewelry'}
 else if(pg==='product'){app.innerHTML=product(a);key='shop';document.title=((PRODUCTS.find(p=>p.id===a)||{}).name||'Product')+' | Abrate Jewelry'}
 else if(pg==='contact'){app.innerHTML=contact();contactInit();key='contact';document.title='Contact | Abrate Jewelry'}
 else{app.innerHTML=home();homeInit();document.title='Abrate Jewelry | Shine Bright in Addis Ababa'}
 $$('.links a[data-p]').forEach(l=>l.classList.toggle('on',l.dataset.p===key));reveal()}
function route(){const h=location.hash||'#/';closeMenu();
 if(/^#(reviews|visit|whatsapp)$/.test(h)){render('home','');const t=$(h);if(t)requestAnimationFrame(()=>t.scrollIntoView());return}
 const [,pg,arg]=h.replace('#','').split('/');render(pg||'home',decodeURIComponent(arg||''));window.scrollTo({top:0,behavior:'instant'})}
const burger=$('.burger'),links=$('#links'),root=document.documentElement;
function closeMenu(){links.classList.remove('open');burger.setAttribute('aria-expanded','false');root.classList.remove('lock')}
burger.onclick=()=>{const o=!links.classList.contains('open');links.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);root.classList.toggle('lock',o)};
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
addEventListener('resize',()=>{if(innerWidth>1080)closeMenu()});
$$('[data-wa]').forEach(l=>l.href=waURL(0,'general'));
$('#foot').innerHTML=foot();
addEventListener('hashchange',()=>{cur='';route()});route();
</script>
</body>
